---
- hosts: nodejs
  vars_files:
    - group_vars/containers/vars.yml
  tasks:
    - name: Add system user
      user:
        name: ctgs
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes

  roles:
    - ddns
    - nginx
    - nodejs
    - closingtags
