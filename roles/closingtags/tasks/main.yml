- name: Ensure tests pass first
  tags: closingtags, build, deploy
  shell: npm run test
  args:
    chdir: ~/Dev/projects/closingtags/
  delegate_to: 127.0.0.1

- name: Build closingtags site locally
  tags: closingtags, build, deploy
  shell: npm run build
  args:
    chdir: ~/Dev/projects/closingtags/
  delegate_to: 127.0.0.1

- name: Get build name
  command: echo "site-{{ now(utc=true,fmt='%Y-%m-%d_%H-%M') }}"
  register: build_name

- name: Create build dir
  tags: closingtags, build, deploy
  file:
    path: /var/www/{{ build_name.stdout }}
    state: directory
    owner: ctgs
    group: ctgs
    mode: 0644

- name: Sync build dir to server
  tags: closingtags, build, deploy
  ansible.posix.synchronize:
    src: ~/Dev/projects/closingtags/build/
    dest: /var/www/{{ build_name.stdout }}/
    recursive: true

- name: Set permissions on build
  tags: closingtags, build, deploy
  file:
    state: directory
    dest: /var/www/{{ build_name.stdout }}/
    recurse: true
    owner: ctgs
    group: ctgs
    mode: 0644

- name: Copy .env to server
  tags: closingtags, build, deploy
  copy:
    src: ~/Dev/projects/closingtags/.env
    dest: /var/www/.env

- name: Copy package-lock.json to server
  tags: closingtags, build, deploy
  copy:
    src: ~/Dev/projects/closingtags/package-lock.json
    dest: /var/www/{{ build_name.stdout }}/package-lock.json
    owner: ctgs
    group: ctgs
    mode: 0644

- name: Copy package.json to server
  tags: closingtags, build, deploy
  copy:
    src: ~/Dev/projects/closingtags/package.json
    dest: /var/www/{{ build_name.stdout }}/package.json
    owner: ctgs
    group: ctgs
    mode: 0644

- name: Install dependencies from lockfile
  tags: closingtags, build, deploy
  shell: npm ci --ignore-scripts
  args:
    chdir: /var/www/{{ build_name.stdout }}/

- name: Dependency permissions
  file:
    dest: /var/www/{{ build_name.stdout }}/
    owner: ctgs
    group: ctgs
    mode: 0775
    recurse: true

- name: Point server to latest build
  file:
    src: /var/www/{{ build_name.stdout }}/
    dest: /var/www/current
    state: link
    follow: true

- name: Create service file
  tags: closingtags, build, deploy
  template:
    src: files/service
    dest: /etc/systemd/system/nodejs.service
  register: service_conf

- name: Reload systemd daemon
  tags: closingtags, build, deploy, systemd
  systemd:
    daemon_reload: yes
  when: service_conf.changed

- name: Restart NodeJS service
  tags: closingtags, build, deploy
  service:
    name: nodejs
    state: restarted
    enabled: yes

- name: Find other builds
  tags: closingtags, build, deploy
  find:
    paths: /var/www
    excludes: "{{ build_name.stdout }}"
    use_regex: false
    patterns: site-*
    file_type: directory
  register: otherBuilds

- name: Change permissions on old builds
  tags: closingtags, build, deploy
  file:
    path: "{{ item.path }}"
    owner: root
    group: root
  with_items: "{{ otherBuilds.files }}"

- name: Find builds older than 30 days
  tags: closingtags, build, deploy
  find:
    paths: /var/www
    age: 30d
    use_regex: false
    patterns: site-*
    file_type: directory
  register: filesOlderThan30D

- name: Delete old builds
  tags: closingtags, build, deploy
  file:
    path: "{{ item.path }}"
    state: absent
  with_items: "{{ filesOlderThan30D.files }}"
