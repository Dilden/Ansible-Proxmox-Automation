- name: Add nginx repo
  deb822_repository:
    name: nginx
    types: deb
    uris: "https://nginx.org/packages/mainline/ubuntu"
    suites: "noble"
    components:
      - nginx
    signed_by: "https://nginx.org/keys/nginx_signing.key"
    state: present
  become: true

- name: Prefer nginx repo
  copy:
    dest: "/etc/apt/preferences.d/99nginx"
    content: |
      Package: 
        Pin: origin nginx.org
        Pin: release o=nginx
        Pin-Priority: 900
  become: true

- name: Install nginx
  tags: install, nginx
  apt:
    name: nginx
    state: latest
  become: true

- name: Start nginx
  tags: install, nginx
  service:
    name: nginx
    state: started
  become: true

- name: Harden nginx service
  tags: install, nginx
  template:
    src: files/service
    dest: /etc/systemd/system/nginx.service.d/override.conf
  register: service_conf
  become: true

- name: Reload systemd daemon
  tags: install, nginx
  systemd:
    daemon_reload: yes
  when: service_conf.changed
  become: true

- name: Restart nginx service
  tags: nginx, install
  service:
    name: nginx
    state: restarted
    enabled: yes
  become: true
