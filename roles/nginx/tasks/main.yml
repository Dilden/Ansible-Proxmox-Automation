- name: Install nginx
  tags: install, nginx
  apt:
    name: nginx
    state: latest

- name: Start nginx
  tags: install, nginx
  service:
    name: nginx
    state: started

- name: Harden nginx service
  tags: install, nginx
  template:
    src: files/service
    dest: /etc/systemd/system/nginx.service.d/override.conf
  register: service_conf

- name: Reload systemd daemon
  tags: install, nginx
  systemd:
    daemon_reload: yes
  when: service_conf.changed

- name: Restart nginx service
  tags: nginx, install
  service:
    name: nginx
    state: restarted
    enabled: yes
